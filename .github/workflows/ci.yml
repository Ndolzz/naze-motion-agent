# CI unit tests for pure JVM core modules (NMA-TEST-014)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  test:
    name: Unit tests (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Run core tests
        run: |
          set +e
          gradle :core:domain:test :core:state:test :core:action:test :core:engine:test :core:adapter:test :core:ai:test --console=plain --stacktrace > citestoutput.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "### Core tests failed. Gradle output tail" >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            tail -n 200 citestoutput.txt >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            git config user.name "naze"
            git config user.email "nueexoly@gmail.com"
            git add citestoutput.txt
            git commit -m "chore: record ci test output for the failed run"
            git push origin "HEAD:refs/heads/buildlogs" --force
            exit 1
          fi
