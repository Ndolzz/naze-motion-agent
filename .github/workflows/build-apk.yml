# Debug APK build. Uses the Android SDK preinstalled on ubuntu runners.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --console=plain --stacktrace > gradleoutput.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            tail -n 200 gradleoutput.txt > gradletail.txt
            echo "### Debug APK build failed. Gradle output tail" >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            cat gradletail.txt >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Report build failure on the commit
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import json
          body = open('gradletail.txt').read()
          payload = {"body": "Debug APK build failed. Last 200 lines of Gradle output:\n\n~~~\n" + body + "\n~~~"}
          with open('commentpayload.json', 'w') as f:
              json.dump(payload, f)
          PYEOF
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d @commentpayload.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" > curlresult.txt || true
          cat curlresult.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naze-motion-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
